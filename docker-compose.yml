services:
  dashboard:
    build: .
    ports:
      - "3005:3000"
    volumes:
      - ./:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      npm-host-bridge:
        ipv4_address: 172.18.0.2

networks:
  npm-host-bridge:
    external: true
